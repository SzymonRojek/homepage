name: Safari

# The e2e suite in WebKit, Safari's engine, on a desktop, an iPad (both ways
# round) and two iPhones. A one-page site doesn't need it on every push, so it
# runs by itself on the 1st of every other month (GitHub emails if it fails)
# and from the Actions tab ("Run workflow") whenever a change might need it.
# A macOS runner, since Playwright's WebKit there is the closest to Safari.
on:
  schedule:
    - cron: "0 7 1 */2 *"
  workflow_dispatch:

jobs:
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      # The runner has 3 cores, so Playwright would pick 1 worker; the Chrome job gets 2.
      - run: npm run test:e2e -- --workers=2
        env:
          SAFARI: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-safari
          path: playwright-report
