name: Mutation testing

# Stryker runs the whole unit test suite once per mutant, so it is far too slow
# for every push. It runs by itself on the 15th of each month, which is the only
# way the score gets measured without someone remembering to, and from the
# Actions tab whenever you want it. Not part of the deploy gate.
#
# A scheduled run mutates everything: it runs on the default branch, where there
# is nothing to compare against. On a branch, "since" cuts the hour to minutes by
# mutating only what changed, at the cost of a partial score.
on:
  schedule:
    - cron: "0 7 15 * *"
  workflow_dispatch:
    inputs:
      mutate:
        description: "Only mutate these files (glob, e.g. src/common/themeSlice.ts). Empty = whole project."
        required: false
        default: ""
      since:
        description: "Only mutate what changed since this ref (e.g. main). Ignored when 'mutate' is set."
        required: false
        default: ""

# Read-only, with no token left in Git: Stryker never needs to write.
permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # "since" needs the history to diff against, and it is not there by default.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Stryker
        env:
          MUTATE: ${{ inputs.mutate }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$MUTATE" ]; then
            npx stryker run --concurrency 4 --mutate "$MUTATE"
          elif [ -n "$SINCE" ]; then
            # The script filters by stryker.config.json's own mutate list, since
            # --mutate replaces that list rather than narrowing it.
            CHANGED=$(node scripts/changed-mutants.ts "origin/$SINCE")
            if [ -z "$CHANGED" ]; then
              echo "No source file changed since $SINCE, so there is nothing to mutate." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Mutating only what changed since $SINCE: $CHANGED"
            npx stryker run --concurrency 4 --mutate "$CHANGED"
          else
            npx stryker run --concurrency 4
          fi
      - name: Write the score to the run summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const file = "reports/mutation/mutation.json";
          if (!fs.existsSync(file)) { console.log("No report"); process.exit(0); }
          const { files } = JSON.parse(fs.readFileSync(file, "utf8"));
          const detected = ["Killed", "Timeout"];
          const counted = [...detected, "Survived", "NoCoverage"];
          let rows = "| File | Score | Killed | Survived | No coverage |\n|---|---|---|---|---|\n";
          let all = { d: 0, c: 0 };
          for (const [name, { mutants }] of Object.entries(files)) {
            const n = (s) => mutants.filter((m) => m.status === s).length;
            const d = detected.reduce((a, s) => a + n(s), 0);
            const c = counted.reduce((a, s) => a + n(s), 0);
            all.d += d; all.c += c;
            if (c) rows += `| ${name} | ${((100 * d) / c).toFixed(1)}% | ${d} | ${n("Survived")} | ${n("NoCoverage")} |\n`;
          }
          const score = all.c ? ((100 * all.d) / all.c).toFixed(1) : "n/a";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Mutation score: ${score}%\n\n${rows}\nDownload the **mutation-report** artifact and open index.html to see each surviving mutant.\n`);
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
