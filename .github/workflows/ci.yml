name: CI

on:
  push:
    branches: [main, dev]
  # PRs into dev are checked too, so Dependabot updates are tested before merge.
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on high-severity advisories in the dependencies shipped to visitors.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          # The folder starts with a dot, and hidden files are skipped by default.
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # The e2e suite again in WebKit, Safari's engine, on a desktop, an iPad (both ways round) and two iPhones.
  # A macOS runner, since Playwright's WebKit there is the closest to Safari. Deploys don't wait for it.
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      # The runner has 3 cores, so Playwright would pick 1 worker; the Chrome job gets 2.
      - run: npm run test:e2e -- --workers=2
        env:
          SAFARI: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-safari
          path: playwright-report

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
