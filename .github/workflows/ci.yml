name: CI

on:
  push:
    branches: [main, dev]
  # Only PRs into dev, which in practice means Dependabot's: its branches are
  # not in the push list above, so a PR is their only run. A PR from dev needs
  # no run of its own, because GitHub attaches a check to the commit rather
  # than to the event, so the push that created the commit already reports the
  # build check on the PR. Running it again tests the same commit twice.
  pull_request:
    branches: [dev]

# The token only reads. The deploy job alone gets more: what publishing to
# GitHub Pages needs, and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Leaves no token in Git for the steps that run other people's code
          # (npm ci, the build, the tests), so none of them can push.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on high-severity advisories in the dependencies shipped to visitors.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Formatting is a gate, not something to remember: prettier --write is
      # the fix (npm run format).
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # The browser download and its apt step have spiked to ten minutes on a
      # bad run. Cache it by the Playwright version, since that is what decides
      # which browser build the suite needs.
      - id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser is cached; the system libraries it needs are not.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          # The folder starts with a dot, and hidden files are skipped by default.
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # GitHub's own Pages actions publish the build this run tested. The site
  # comes from here alone, not from a branch, so nothing reaches it without a
  # pull request into main and every check above.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
