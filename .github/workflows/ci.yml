name: CI

on:
  push:
    branches: [main, dev]
  # Only PRs into dev, which in practice means Dependabot's: its branches are
  # not in the push list above, so a PR is their only run. A PR from dev needs
  # no run of its own, because GitHub attaches a check to the commit rather
  # than to the event, so the push that created the commit already reports the
  # build check on the PR. Running it again tests the same commit twice.
  pull_request:
    branches: [dev]

# The token only reads. The deploy job alone gets more: what publishing to
# GitHub Pages needs, and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Leaves no token in Git for the steps that run other people's code
          # (npm ci, the build, the tests), so none of them can push.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on high-severity advisories in the dependencies shipped to visitors.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Formatting is a gate, not something to remember: prettier --write is
      # the fix (npm run format).
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # The browser download and its apt step spiked to ten minutes on a bad
      # run. The cache, keyed by the Playwright version, took the download out
      # of the picture and proved the cost was apt: on 2026-10-25 the browser
      # came back in 6s and `install-deps` still took 449s. So on a hit we
      # install nothing and rely on the runner image, which ships browsers and
      # their libraries. If Chromium ever fails to launch, put back
      # `npx playwright install-deps chromium` behind the cache-hit condition.
      - id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          # The folder starts with a dot, and hidden files are skipped by default.
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # GitHub's own Pages actions publish the build this run tested. The site
  # comes from here alone, not from a branch, so nothing reaches it without a
  # pull request into main and every check above.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Whether the page a visitor sees really changed, asked before this run
      # publishes: the whole page is in index.html and Vite writes the hashed
      # asset names into it, so a difference there is a real change, while a
      # commit that only touches CI or tooling leaves it identical. A failed
      # fetch, or a copy still held in the ten-minute Pages cache, counts as
      # changed: one ping too many beats a change nobody is told about.
      - id: page
        run: |
          curl -sS -o live.html --max-time 20 https://szymonrojek.com/ || true
          if [ -s live.html ] && cmp -s live.html dist/index.html; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      # Bing's crawler reached the site once, on 2026-10-14, and the fetch
      # failed while the DNS and the certificate were still settling. IndexNow
      # tells it a page changed instead of waiting for it to come back, and it
      # asks to hear about real changes only, which is what the step above
      # decides. The key is public by design: it only proves the domain is
      # mine, and the worst it allows is a recrawl of this site.
      # 202 is the protocol's success, 200 Bing's own; a failed ping leaves the
      # deploy green, since the site is published by the time it runs.
      - name: Tell IndexNow the page changed
        if: steps.page.outputs.changed == 'yes'
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
            "https://api.indexnow.org/indexnow?url=https://szymonrojek.com/&key=57e9c3c3c9e7413dadd6c79df1368733")
          echo "IndexNow answered $code"
          case "$code" in 200 | 202) ;; *) exit 1 ;; esac
