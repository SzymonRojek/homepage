# Monthly dependency updates (weekly until 2026-10-23: a one-page site does
# not change fast enough to need four times the pull requests to review).
# PRs target dev, so they go through the same checks and the user-merged
# dev -> main flow as any other change. Dependabot's alerts stay on, so an
# advisory is still reported; its automatic security pull requests are off,
# since the only ones it could raise were dev-only transitives with no fix
# path, and CI's `npm audit --omit=dev --audit-level=high` already stops a
# shipped advisory from reaching the site.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # A version is only taken once it has been public for a week, so a package
    # published and pulled in the same day never reaches the site.
    cooldown:
      default-days: 7
    ignore:
      # eslint-plugin-react supports ESLint up to 9 only; ESLint 10 breaks npm ci.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom have to move together: React refuses to start if
      # the two versions differ, so a PR that bumps one alone fails every test.
      react:
        patterns: ["react", "react-dom"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
