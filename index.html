<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The fonts of the first screen load straight away, in parallel with the
      app, so the page is drawn once in its real fonts: no text reflow, and the
      photo doesn't jump when the fonts arrive. The @font-face rules are below.
    -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Paint the saved or OS theme before the app loads, so a dark-mode reload
      never flashes light. Same rule as getInitialDarkTheme in themeSlice.ts;
      the colours match theme.colors.site.background (checked in theme.test.ts).
    -->
    <style>
      html {
        background: #f4ead6;
      }
      html[data-theme="dark"] {
        background: #0b1513;
        color-scheme: dark;
      }
      /* The build writes a light static copy of the page into #root for
         search engines (scripts/prerender.ts). With a dark theme it stays
         hidden, page background included, until the app has drawn the page. */
      html[data-theme="dark"] body[data-prerendered] {
        visibility: hidden;
        background: none;
      }
      /* After a reload below the top, the page stays unseen until the script
         after #root has jumped back to its place, so it never shows the top
         first. */
      html[data-restoring-scroll="pending"] body {
        visibility: hidden;
      }
      /* Self-hosted variable fonts (from @fontsource-variable, OFL), one file
         per alphabet for every weight: Bricolage Grotesque for headings,
         Geist for text and Geist Mono for tiny labels. */
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url("%BASE_URL%fonts/bricolage-grotesque-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url("%BASE_URL%fonts/bricolage-grotesque-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist Mono";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-mono-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist Mono";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-mono-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Until those files arrive the text is drawn in a system font. Plain
         sans-serif set it wider or narrower, so lines broke elsewhere and
         the page moved when the real fonts swapped in (layout shift 0.056 in
         PageSpeed, 2026-10-17). These fallbacks scale a system font to the
         real one: size-adjust measured on the page's own text, then tuned
         so the fewest blocks change their line count at 14 widths from
         320px to 1440px (Geist 103.2% of Arial, its bold 101% of Arial
         Bold, Bricolage Grotesque, only bold on the page, 101.5%), ascent
         and descent from the real font, divided by size-adjust. Arial on
         Macs and iPhones, Liberation Sans (Arial's metrics) on Linux,
         Roboto (within 1% of Arial's widths) on Android. Only for the
         letters the real fonts have: a sign they lack (→, ✓) still comes
         from the system's own font, as before, not from Arial. Measure
         again if the fonts or the text change much; e2e/fonts.spec.ts
         checks it. */
      @font-face {
        font-family: "Geist Fallback";
        font-weight: 100 549;
        src:
          local("Arial"), local("ArialMT"), local("Liberation Sans"),
          local("LiberationSans"), local("Roboto"), local("Roboto-Regular");
        size-adjust: 103.2%;
        ascent-override: 97.9%;
        descent-override: 28.1%;
        line-gap-override: 0%;
        unicode-range:
          U+0000-02FF, U+0304, U+0308, U+0329, U+1E00-1EFF, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist Fallback";
        font-weight: 550 1000;
        src:
          local("Arial Bold"), local("Arial-BoldMT"),
          local("Liberation Sans Bold"), local("LiberationSans-Bold"),
          local("Roboto Bold"), local("Roboto-Bold");
        size-adjust: 101%;
        ascent-override: 100%;
        descent-override: 28.7%;
        line-gap-override: 0%;
        unicode-range:
          U+0000-02FF, U+0304, U+0308, U+0329, U+1E00-1EFF, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Bricolage Fallback";
        font-weight: 100 1000;
        src:
          local("Arial Bold"), local("Arial-BoldMT"),
          local("Liberation Sans Bold"), local("LiberationSans-Bold"),
          local("Roboto Bold"), local("Roboto-Bold");
        size-adjust: 101.5%;
        ascent-override: 91.6%;
        descent-override: 26.6%;
        line-gap-override: 0%;
        unicode-range:
          U+0000-02FF, U+0304, U+0308, U+0329, U+1E00-1EFF, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("dark");
        const isDark =
          saved !== null
            ? saved === "true"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      } catch {
        // Storage blocked: the app sets the theme once it loads.
      }
    </script>
    <script>
      // A reload below the top goes back there (the script after #root), with
      // the top bar out of sight until useInitialScroll has finished: a
      // reload is not the visitor scrolling up. The position is saved by
      // useInitialScroll, under the same key.
      try {
        const [visit] = performance.getEntriesByType("navigation");
        if (
          visit?.type === "reload" &&
          Number(sessionStorage.getItem("scrollY")) > 0
        ) {
          document.documentElement.dataset.restoringScroll = "pending";
        }
      } catch {
        // Storage blocked: the page starts at the top.
      }
    </script>
    <title>Szymon Rojek | Test Engineer</title>
    <meta
      name="description"
      content="Test Engineer in Hove, UK, open to Test Automation and QA roles: AI-assisted testing, data migration and ETL, SQL reconciliation, API testing and Playwright."
    />
    <link rel="canonical" href="https://szymonrojek.com/" />
    <meta name="author" content="Szymon Rojek" />
    <!-- My initials, as in the top bar: SVG where supported, PNG otherwise. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Google Search doesn't use SVG icons and wants one over 48px. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#0B1513"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0B1513"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Szymon Rojek" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://szymonrojek.com/" />
    <meta property="og:title" content="Szymon Rojek | Test Engineer" />
    <meta
      property="og:description"
      content="Test Engineer in Hove, UK, open to Test Automation and QA roles: AI-assisted testing, data migration and ETL, SQL reconciliation, API testing and Playwright."
    />
    <meta property="og:image" content="https://szymonrojek.com/og-image.jpg" />
    <!-- 1200×630, the size LinkedIn and X show large. -->
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Szymon Rojek, Test Engineer, beside a photo of Szymon"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The build's copy of the page is in #root by now: jump back to the
      // saved place before the first paint, then show the page.
      if (document.documentElement.dataset.restoringScroll === "pending") {
        try {
          window.scrollTo({
            top: Number(sessionStorage.getItem("scrollY")),
            behavior: "instant",
          });
        } catch {
          // Storage blocked: useInitialScroll tries again.
        }
        document.documentElement.dataset.restoringScroll = "";
      }
    </script>
    <script>
      // If the app never runs — a bundle stopped by a network, a proxy or an
      // extension, or one that throws — the rule in the head would leave a
      // dark-theme visitor with a page hidden for good. Once everything else
      // has settled, show the build's copy instead: it is drawn in the light
      // colours, which reads far better than a blank screen. The app takes
      // this mark off itself long before here (usePrerenderCleanup).
      addEventListener("load", () => {
        setTimeout(() => {
          // Gone already: the app has the page, and the theme is its business.
          if (document.body.dataset.prerendered === undefined) return;
          delete document.body.dataset.prerendered;
          delete document.documentElement.dataset.theme;
        }, 1200);
      });
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
