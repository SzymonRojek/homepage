<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Paint the saved or OS theme before the app loads, so a dark-mode reload
      never flashes light. Same rule as getInitialDarkTheme in themeSlice.ts;
      the colours match theme.colors.site.background (checked in theme.test.ts).
    -->
    <style>
      html {
        background: #fbfbfe;
      }
      html[data-theme="dark"] {
        background: #252525;
        color-scheme: dark;
      }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("dark");
        const isDark =
          saved !== null
            ? saved === "true"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      } catch {
        // Storage blocked: the app sets the theme once it loads.
      }
    </script>
    <title>Szymon Rojek | Software Test Engineer</title>
    <meta
      name="description"
      content="Szymon Rojek, Software Test Engineer in Hove, UK, open to QA Engineer and Data/ETL Test Analyst roles: data migration and ETL testing, SQL reconciliation, API testing and Playwright."
    />
    <link rel="canonical" href="https://szymonrojek.github.io/homepage/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#FBFBFE"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#252525"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://szymonrojek.github.io/homepage/" />
    <meta property="og:title" content="Szymon Rojek | Software Test Engineer" />
    <meta
      property="og:description"
      content="Software Test Engineer in Hove, UK, open to QA Engineer and Data/ETL Test Analyst roles: data migration and ETL testing, SQL reconciliation, API testing and Playwright."
    />
    <meta
      property="og:image"
      content="https://szymonrojek.github.io/homepage/og-image.jpg"
    />
    <meta property="og:image:alt" content="Photo of Szymon Rojek" />
    <meta name="twitter:card" content="summary" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
