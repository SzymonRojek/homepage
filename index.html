<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The fonts of the first screen load straight away, in parallel with the
      app, so the page is drawn once in its real fonts: no text reflow, and the
      photo doesn't jump when the fonts arrive. The @font-face rules are below.
    -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Paint the saved or OS theme before the app loads, so a dark-mode reload
      never flashes light. Same rule as getInitialDarkTheme in themeSlice.ts;
      the colours match theme.colors.site.background (checked in theme.test.ts).
    -->
    <style>
      html {
        background: #f4ead6;
      }
      html[data-theme="dark"] {
        background: #0b1513;
        color-scheme: dark;
      }
      /* The build writes a light static copy of the page into #root for
         search engines (scripts/prerender.ts). With a dark theme it stays
         hidden, page background included, until the app has drawn the page. */
      html[data-theme="dark"] body[data-prerendered] {
        visibility: hidden;
        background: none;
      }
      /* Self-hosted variable fonts (from @fontsource-variable, OFL), one file
         per alphabet for every weight: Bricolage Grotesque for headings,
         Geist for text and Geist Mono for tiny labels. */
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url("%BASE_URL%fonts/bricolage-grotesque-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url("%BASE_URL%fonts/bricolage-grotesque-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist Mono";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-mono-latin-ext-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist Mono";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("%BASE_URL%fonts/geist-mono-latin-wght-normal.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("dark");
        const isDark =
          saved !== null
            ? saved === "true"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      } catch {
        // Storage blocked: the app sets the theme once it loads.
      }
    </script>
    <title>Szymon Rojek | Test Engineer</title>
    <meta
      name="description"
      content="Test Engineer in Hove, UK, open to Test Automation and QA roles: data migration and ETL testing, SQL reconciliation, API testing and Playwright."
    />
    <link rel="canonical" href="https://szymonrojek.com/" />
    <meta name="author" content="Szymon Rojek" />
    <!-- My initials, as in the top bar: SVG where supported, PNG otherwise. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Google Search doesn't use SVG icons and wants one over 48px. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#0B1513"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0B1513"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Szymon Rojek" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://szymonrojek.com/" />
    <meta property="og:title" content="Szymon Rojek | Test Engineer" />
    <meta
      property="og:description"
      content="Test Engineer in Hove, UK, open to Test Automation and QA roles: data migration and ETL testing, SQL reconciliation, API testing and Playwright."
    />
    <meta property="og:image" content="https://szymonrojek.com/og-image.jpg" />
    <!-- 1200×630, the size LinkedIn and X show large. -->
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Szymon Rojek, Test Engineer, beside a photo of Szymon"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
